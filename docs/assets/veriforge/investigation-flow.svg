<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title description">
  <title id="title">VerifForge investigation architecture</title>
  <desc id="description">A reviewed contract and typed planner proposal enter a bounded controller. A trusted runner collects observations. An independent checker determines the verdict, and evidence is saved for replay. This is an original architecture diagram, not a screenshot or proof of execution.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#73958e"/></marker></defs>
  <rect width="1120" height="350" rx="18" fill="#111c25"/>
  <g font-family="system-ui, sans-serif">
    <text x="36" y="41" fill="#b5c8cd" font-size="12" letter-spacing="2">FROM REQUIREMENT TO REPRODUCIBLE FINDING</text>
    <text x="36" y="78" fill="#f2f5ef" font-size="26" font-weight="650">Propose. Execute. Check. Replay.</text>
    <g fill="none" stroke="#73958e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M231 157H275"/><path d="M231 248H253V174H275"/>
      <path d="M456 166H502"/><path d="M684 166H730"/><path d="M912 166H954"/>
      <path d="M819 209V276H366V209"/>
    </g>
    <g fill="#1a2c36" stroke="#38505a">
      <rect x="36" y="119" width="195" height="76" rx="10"/><rect x="36" y="217" width="195" height="64" rx="10"/>
      <rect x="275" y="119" width="181" height="90" rx="10"/><rect x="502" y="119" width="182" height="90" rx="10"/>
      <rect x="730" y="119" width="182" height="90" rx="10" stroke="#78c5ac"/><rect x="954" y="119" width="132" height="90" rx="10"/>
    </g>
    <g fill="#eff5f0" font-size="16" font-weight="600">
      <text x="53" y="149">Reviewed contract</text><text x="53" y="243">Typed proposal</text>
      <text x="292" y="149">Bounded controller</text><text x="520" y="149">Trusted runner</text>
      <text x="747" y="149">Independent check</text><text x="970" y="149">Evidence</text>
    </g>
    <g fill="#b5c8cd" font-size="12">
      <text x="53" y="174">Requirements + fixed identity</text><text x="53" y="264">Model optional · operations only</text>
      <text x="292" y="173">Validate · budget · cancel</text><text x="292" y="193">No arbitrary commands</text>
      <text x="520" y="173">Curated HDL + observations</text><text x="520" y="193">Actual tool/environment record</text>
      <text x="747" y="173">Expected versus observed</text><text x="747" y="193">Checker determines verdict</text>
      <text x="970" y="173">Exact stimulus</text><text x="970" y="193">Hashes + replay</text>
      <text x="450" y="267" fill="#a8d9c7">Checked feedback for a later bounded experiment</text>
      <text x="36" y="321" fill="#8da3ab">ARCHITECTURE ILLUSTRATION · live capability varies by adapter; see the status table.</text>
    </g>
  </g>
</svg>
