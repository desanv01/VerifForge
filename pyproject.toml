[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "veriforge"
version = "0.1.0"
description = "Typed, independently checked RTL investigation workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11,<3", "fastapi>=0.115,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "rq>=2.2,<3", "redis>=5,<7", "httpx>=0.28,<1",
  "cocotb>=2.0,<2.1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/veriforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
