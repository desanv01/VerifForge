name: Planner PostgreSQL and RQ qualification (mock HTTP)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-postgres-acceptance
  cancel-in-progress: false

jobs:
  qualification:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actual isolated PG and RQ processes with explicitly mocked HTTP
        run: python3 scripts/ci_planner_postgres.py
      - name: Always remove only this run's owned ephemeral resources
        if: always()
        run: python3 scripts/ci_planner_postgres.py --cleanup
      - name: Upload bounded fixture evidence (not live Meta)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: planner-pg-mock-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/planner-postgres/
          retention-days: 1
          compression-level: 6
          include-hidden-files: false
          if-no-files-found: error
          overwrite: false
