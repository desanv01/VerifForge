name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      web: ${{ steps.paths.outputs.web }}
      fifo: ${{ steps.paths.outputs.fifo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def classify(paths, force=False):
              shared = force or any(p.startswith('.github/workflows/') for p in paths)
              python = shared or any(
                  p.startswith(('src/', 'tests/', 'migrations/', 'targets/', 'infra/'))
                  or p in ('pyproject.toml', 'uv.lock', 'alembic.ini') for p in paths)
              web = shared or any(p.startswith('apps/web/') for p in paths)
              fifo = shared or any(
                  p.startswith(('src/veriforge/rtl/', 'src/veriforge/contracts/',
                                'targets/fifo/', 'tests/rtl/'))
                  or p in ('pyproject.toml', 'uv.lock', 'infra/rtl/Dockerfile',
                           'tests/acceptance/test_rtl_acceptance.py') for p in paths)
              return {'python': python, 'web': web, 'fifo': fifo}

          base = os.environ.get('BASE_SHA', '')
          head = os.environ['HEAD_SHA']
          force = os.environ['EVENT_NAME'] == 'workflow_dispatch' or not base or set(base) == {'0'}
          if not force:
              available = subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'],
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              force = available.returncode != 0
          paths = []
          if not force:
              revision = base + '...' + head if os.environ['EVENT_NAME'] == 'pull_request' else base
              command = ['git', 'diff', '--name-only', '--no-renames', '-z', revision]
              if os.environ['EVENT_NAME'] != 'pull_request':
                  command.append(head)
              raw = subprocess.check_output(command + ['--'])
              paths = [p.decode('utf-8', errors='replace') for p in raw.split(b'\0') if p]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in classify(paths, force).items():
                  output.write(f'{key}={str(value).lower()}\n')
          PY

  python:
    name: Python checks (no live integrations)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VF_REAL_RTL: '0'
      VF_ARITHMETIC_SIM_GATE: disabled
      VERIFORGE_EVIDENCE_ACCEPTANCE: '0'
      VERIFORGE_REPLAY_ACCEPTANCE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - name: Install pinned uv and locked project
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.25
          uv sync --locked --dev
      - name: Unit, contract, controlled-process and SQLite API checks
        run: |
          uv run --no-sync pytest tests -q --strict-config --strict-markers \
            --ignore=tests/integration \
            --ignore=tests/evidence/test_live_rtl.py \
            --ignore=tests/arithmetic/test_live.py \
            --deselect=tests/rtl/test_runner.py::test_real_correct_mutant_and_replay \
            --deselect=tests/rtl/test_runner.py::test_real_build_failure_is_separate \
            --junitxml=ci-artifacts/python.xml

  web:
    name: Web tests, types and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  fifo:
    name: Real Linux FIFO smoke
    needs: changes
    if: needs.changes.outputs.fifo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the approved simulator image
        timeout-minutes: 8
        run: docker build --tag veriforge-rtl:ci --file infra/rtl/Dockerfile .
      - name: Require a real compatible simulator (never skip into a green smoke)
        run: |
          test "$(id -u)" -ne 0
          docker run --pull never --rm --network none --cap-drop ALL \
            --user "$(id -u):$(id -g)" \
            --entrypoint python veriforge-rtl:ci -c \
            'import os, platform, shutil, subprocess, cocotb; from find_libpython import find_libpython; assert os.getuid() != 0; assert platform.system() == "Linux"; assert shutil.which("verilator"); assert cocotb.__version__.startswith("2.0."); assert find_libpython(); subprocess.run(["verilator", "--version"], check=True, timeout=5); print("cocotb", cocotb.__version__)'
      - name: Real reference, mutant, exact replay and build-error checks
        timeout-minutes: 9
        shell: bash
        run: |
          ci_uid="$(id -u)"
          ci_gid="$(id -g)"
          test "${ci_uid}" -ne 0
          umask 077
          mkdir -p ci-artifacts/fifo
          test -O ci-artifacts/fifo && test -w ci-artifacts/fifo
          trap 'docker rm -f veriforge-ci-fifo >/dev/null 2>&1 || true' EXIT INT TERM
          timeout --signal=TERM --kill-after=15s 8m \
            docker run --pull never --rm --name veriforge-ci-fifo \
              --user "${ci_uid}:${ci_gid}" \
              --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
              --tmpfs /tmp:rw,exec,nosuid,size=128m \
              --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/ci-artifacts/fifo,target=/evidence" \
              --entrypoint python veriforge-rtl:ci -m pytest \
              tests/rtl/test_runner.py::test_real_correct_mutant_and_replay \
              tests/rtl/test_runner.py::test_real_build_failure_is_separate \
              tests/rtl/test_runner.py::test_timeout_and_cancel_kill_descendants \
              -q --basetemp=/evidence/attempts --junitxml=/evidence/results.xml \
              -o cache_dir=/tmp/pytest-cache
      - name: Remove only this job's container
        if: always()
        run: docker rm -f veriforge-ci-fifo >/dev/null 2>&1 || true

  gate:
    name: CI gate
    if: always()
    needs: [changes, python, web, fifo]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['JOB_RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if results['changes']['result'] != 'success':
              raise SystemExit('Change selection failed')
          selected = results['changes'].get('outputs', {})
          for name in ('python', 'web', 'fifo'):
              if selected.get(name) not in ('true', 'false'):
                  raise SystemExit('A selection output is missing')
              if selected[name] == 'true' and results[name]['result'] != 'success':
                  raise SystemExit('A selected check did not succeed')
          if any(job['result'] not in ('success', 'skipped') for job in results.values()):
              raise SystemExit('A selected check failed or was cancelled')
          print('Live Meta, live Vivado, arithmetic HDL and full runtime integrations are outside this gate.')
          PY
