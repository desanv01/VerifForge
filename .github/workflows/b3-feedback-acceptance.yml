name: One admitted B3 FIFO experiment (no model credentials)

on:
  workflow_dispatch:
    inputs:
      envelope_base64:
        description: Base64 of the exact admitted public FIFO envelope (at most 16384 decoded bytes)
        required: true
        type: string
      envelope_sha256:
        description: SHA256 of the decoded envelope bytes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b3-feedback-acceptance
  cancel-in-progress: false

jobs:
  fifo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the existing approved simulator image
        timeout-minutes: 8
        run: docker build --tag veriforge-b3-fifo:ci --file infra/rtl/Dockerfile .
      - name: Execute exactly the admitted public experiment
        timeout-minutes: 9
        env:
          B3_ENVELOPE_BASE64: ${{ inputs.envelope_base64 }}
          B3_ENVELOPE_SHA256: ${{ inputs.envelope_sha256 }}
          B3_EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          ci_uid="$(id -u)"
          ci_gid="$(id -g)"
          test "${ci_uid}" -ne 0
          umask 077
          mkdir -p ci-artifacts/b3-fifo
          test -O ci-artifacts/b3-fifo && test -w ci-artifacts/b3-fifo
          container_name="veriforge-b3-fifo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "${container_name}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT INT TERM
          timeout --signal=TERM --kill-after=15s 8m \
            docker run --pull never --rm --name "${container_name}" \
              --user "${ci_uid}:${ci_gid}" \
              --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
              --tmpfs /tmp:rw,exec,nosuid,size=128m \
              --env B3_ENVELOPE_BASE64 --env B3_ENVELOPE_SHA256 --env B3_EXPECTED_COMMIT \
              --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/ci-artifacts/b3-fifo,target=/evidence" \
              --entrypoint python veriforge-b3-fifo:ci scripts/run_b3_fifo_experiment.py
      - name: Remove only this job's exact container
        if: always()
        run: docker rm -f "veriforge-b3-fifo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true
      - name: Stage a bounded artifact even after partial tool failure
        if: always()
        run: python3 scripts/run_b3_fifo_experiment.py --stage-evidence
      - name: Upload this one experiment's bounded public evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: b3-fifo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/b3-upload/
          retention-days: 1
          compression-level: 6
          include-hidden-files: false
          if-no-files-found: error
          overwrite: false
